name: Deploy

on:
  push:
    branches: [master]
    paths:
      - backend/**
      - frontend/**
      - .dockerignore
      - docker-compose.yml
      - .github/workflows/deploy.yml
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: sh mvnw -B verify

  # Lints, type-checks and bundles the frontend, so a broken build stops here rather than on the VPS.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/arithmancer
            git fetch origin master
            git reset --hard origin/master
            # --remove-orphans also stops containers of services no longer in docker-compose.yml
            docker compose up -d --build --remove-orphans
            docker image prune -f
            # Wait for the game to answer on 127.0.0.1:PORT (8080 unless .env says otherwise)
            port=$(sed -n 's/^PORT=//p' .env 2>/dev/null || true)
            port=${port:-8080}
            for attempt in $(seq 30); do
              if curl -fsS "http://127.0.0.1:$port/actuator/health" > /dev/null; then
                curl -fsS "http://127.0.0.1:$port/" > /dev/null
                echo "The game is up on 127.0.0.1:$port"
                exit 0
              fi
              sleep 2
            done
            echo "The game is not answering on 127.0.0.1:$port"
            exit 1
