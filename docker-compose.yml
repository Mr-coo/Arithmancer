services:
  backend:
    build: ./backend
    ports:
      # Only reachable from this machine; the public goes through Caddy
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  caddy:
    build: ./caddy
    # Off for local dev; the VPS turns it on with COMPOSE_PROFILES=prod in .env
    profiles: [prod]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
