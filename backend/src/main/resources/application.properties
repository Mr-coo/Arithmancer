spring.application.name=arithmancer

# The built frontend's page is checked on every load, so a deploy shows up right away. Its hashed /assets files are kept
# for good instead, by StaticFilesConfig.
spring.web.resources.cache.cachecontrol.no-cache=true

# Behind the VPS's Caddy, which serves HTTPS and forwards plain HTTP: take the scheme and host from its X-Forwarded-*
# headers (only from local proxies), so the WebSocket's same-origin check sees the page's https:// origin.
server.forward-headers-strategy=native
